<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear cuenta</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="auth.css">
    </head>
    <body class="auth-body">
        <div class="auth-card">
            <h1>Crear cuenta</h1>
            <form id="form-registro">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" maxlength="100" required>
                </div>
                <div class="input-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" minlength="6" required>
                </div>
                <div class="input-group">
                    <label for="password2">Confirmar contraseña:</label>
                    <input type="password" id="password2" minlength="6" required>
                </div>
                <p id="mensaje-error" class="auth-error"></p>
                <button type="submit" class="btn btn-primary auth-btn">Crear cuenta</button>
            </form>
            <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-cliente.js"></script>
        <script src="register.js"></script>
    </body>
</html>
